# ==============================================================================
# AIDA GNN Surrogate Model & Data Assimilation Configuration
# Configured for Terrain-Following 4D Trajectory Training
# ==============================================================================

paths:
  zarr_path: "/scratch5/purged/Wei.Huang/src/starviewerweathermodel/data/icosahedral_logstate.zarr"
  obs_dir: "/scratch4/NAGAPE/epic/Wei.Huang/src/starviewerweathermodel/data/all_NNJA_data_2024"
  edges_path: "/scratch5/purged/Wei.Huang/src/starviewerweathermodel/graph/graph-grid/icosahedral_edge_index_m6.pt"
  checkpoint_path: "checkpoints/aida_gnn.pt"

mesh:
  name: "icosahedral_m6"
  num_nodes: 40962
  num_levels: 32
  samples: 100

model:
  hidden_dim: 256              # Increase hidden capacity from 128 -> 256
  num_layers: 6                # Increase message-passing depth from 4 -> 6
  # Terrain-Following 4D Trajectory Architecture Parameters
  in_vars: 14          # Dynamic input channels (7 vars x 2 timesteps: X_-6h, X_0)
  out_vars: 7          # Output channels predicted (ln_t, u, v, w, q, ln_rho, ln_p for X_+6h)
  num_static_feats: 2  # Static node features (Surface Elevation + Land-Sea Mask)

training:
  epochs: 10
  batch_size: 1        # Batch size per GPU (lowered to fit memory)
  accum_steps: 8       # Gradient accumulation steps (Effective batch size = 16)
  lr: 0.0003                   # Base Learning Rate
  warmup_epochs: 3             # 3-Epoch linear learning rate warmup
  weight_decay: 0.0001
  log_interval: 1
  save_interval: 1
  log_batch_freq: 10
 #resume_checkpoint: "checkpoints/aida_gnn_conv_amsua_iasi.pt"

loss_weights:
  # Base Reconstruction & Physical Regularization
  w_mse: 1.0
  w_conv: 0.05
  lambda_dyn: 0.0001           # Soft dynamics constraint to prevent early gradient explosion
  weight_grad_state: 0.25
  lambda_p_acc: 0.15
  lambda_asym_p: 0.35
  lambda_asym_q: 0.05
  lambda_laplacian_p: 0.01
  weight_state_eq: 0.12
  weight_q_log: 0.25
  weight_joint_bias: 0.10
  tau_min_p: 0.08

  # Differentiable Multi-Sensor Satellite Radiance Loss Weights (9 Instruments)
  w_rad: 0.0          # AMSU-A Fallback
  w_rad_amsua: 0.00    # AMSU-A Temperature Sounder
  w_rad_iasi: 0.00     # IASI Hyperspectral Sounder
  w_rad_hms: 0.00      # HMS Surface/Atmospheric Microwave Sounder
  w_rad_atms: 0.0     # ATMS Advanced Microwave Sounder
  w_rad_cris: 0.0     # CrIS Cross-track Infrared Sounder
  w_rad_seviri: 0.0   # SEVIRI Geostationary Sounder
  w_rad_gsrasr: 0.0   # GOES ABI All-Sky Radiance
  w_rad_gsrcsr: 0.0   # GOES ABI Clear-Sky Radiance
  w_rad_ahicsr: 0.0   # Himawari AHI Clear-Sky Radiance
